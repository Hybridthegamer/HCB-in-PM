; supervisord.conf – process manager config for running all HCB services
; without Docker (development / bare-metal deployment)
;
; Usage:
;   pip install supervisor
;   supervisord -c scripts/supervisord.conf

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------------------------------------------------------------------------
; Backend (FastAPI + uvicorn)
; ---------------------------------------------------------------------------
[program:backend]
command=uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info
directory=%(here)s/../backend
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/tmp/backend.log
stderr_logfile=/tmp/backend-err.log
stdout_logfile_maxbytes=5MB
environment=
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    REDIS_URL="%(ENV_REDIS_URL)s",
    POLYMARKET_CLOB_URL="%(ENV_POLYMARKET_CLOB_URL)s",
    POLYMARKET_GAMMA_URL="%(ENV_POLYMARKET_GAMMA_URL)s",
    POLYMARKET_WS_URL="%(ENV_POLYMARKET_WS_URL)s",
    SMTP_HOST="%(ENV_SMTP_HOST)s",
    SMTP_PORT="%(ENV_SMTP_PORT)s",
    SMTP_USER="%(ENV_SMTP_USER)s",
    SMTP_PASSWORD="%(ENV_SMTP_PASSWORD)s",
    TELEGRAM_BOT_TOKEN="%(ENV_TELEGRAM_BOT_TOKEN)s",
    TELEGRAM_CHAT_ID="%(ENV_TELEGRAM_CHAT_ID)s",
    LOG_LEVEL="%(ENV_LOG_LEVEL)s"

; ---------------------------------------------------------------------------
; Frontend dev server (not for production – use nginx in prod)
; ---------------------------------------------------------------------------
[program:frontend]
command=npm run dev
directory=%(here)s/../frontend
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/tmp/frontend.log
stderr_logfile=/tmp/frontend-err.log
stdout_logfile_maxbytes=5MB

; ---------------------------------------------------------------------------
; Group all services
; ---------------------------------------------------------------------------
[group:hcb]
programs=backend,frontend
